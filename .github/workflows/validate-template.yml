name: Validar plantilla

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Comprobar archivos obligatorios
        run: |
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          test -f docs/ci-cd.md
          test -f .github/pull_request_template.md
          test -f .github/dependabot.yml
          test -f templates/node-typescript/.github/workflows/ci.yml
